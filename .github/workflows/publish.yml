name: Publish KRAI planner

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: krai-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download current VPS page
        run: |
          mkdir -p site
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 'https://krai.178-236-16-156.sslip.io/' -o site/index.html
          test "$(wc -c < site/index.html)" -ge 10000
          grep -qi '<!DOCTYPE html>' site/index.html
          grep -q 'krai-content-planner' site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
